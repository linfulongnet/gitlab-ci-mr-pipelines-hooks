# GitLab MR Pipelines Hooks 网关配置示例
# 复制为 config.yaml 并按需修改后运行：./gateway -config config.yaml

# HTTP 监听配置
listen:
  addr: ":9932"

# GitLab 连接配置
gitlab:
  # GitLab 根地址（含端口）。可选，默认使用公有 GitLab https://gitlab.com。
  # 私有化部署示例：http://gitlab.example.com:8929
  base_url: "https://gitlab.com"
  # 访问令牌（Personal/Project Access Token，需勾选 api 权限）
  token: "glpat-xxxxxxxxxxxxxxxx"

# Webhook 校验配置
webhook:
  # 与 GitLab Webhook 中配置的 Secret token 一致；留空则不校验（不推荐）
  secret: ""

# 调用 GitLab API 的超时时间
pipeline_timeout: 30s

# Webhook 请求体上限（字节），默认 10MB
max_body_bytes: 10485760
